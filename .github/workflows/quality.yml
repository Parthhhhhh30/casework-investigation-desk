name: CASEWORK quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check app.js
      - run: node --check api/ai.js
      - run: node --check api/graphql.js
      - run: node --check api/lab.js
      - run: npm test
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node dev-server.mjs > /tmp/casework-server.log 2>&1 &
      - run: node browser-smoke.mjs
