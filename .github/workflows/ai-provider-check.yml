name: CASEWORK live provider acceptance (Gemini 3.5)
on:
  workflow_dispatch:
jobs:
  real-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production status and one real Gemini critique
        run: |
          node --input-type=module <<'JS'
          const base='https://casework-investigation-desk-parthhhh.vercel.app';
          const status=await fetch(base+'/api/status').then(r=>r.json());
          console.log('Production status:',JSON.stringify(status));
          if(!status.configured)throw Error('Provider service disabled');
          const cases=[
           {kind:'login',caseId:'CW-101',draft:'Thank you for reporting the repeated sign-in prompt. I will check the fictional session expiry, refresh the session through the supported flow and then retest access before confirming an outcome.',observations:'Fictional GET /workspace returned 401 SESSION_EXPIRED; no customer credentials requested.',label:'SESSION_EXPIRED'},
           {kind:'documents',caseId:'CW-307',draft:'I can see that the imported snapshot may be older than the source document. I will compare the source and imported versions, refresh the fictional integration and verify the new revision.',observations:'Source revision v5 versus imported snapshot v4, with no unexpected access detected in the simulation.',label:'STALE_SNAPSHOT'},
           {kind:'legal',caseId:'CW-412',draft:'Thank you for flagging the unsupported reference. Support cannot establish the legal validity of this patent response. I will preserve the evidence and route it to a qualified patent specialist for review.',observations:'Fictional reference P-1842 absent from evidence registry; legal validation was not performed.',label:'UNVERIFIED_REFERENCE'}
          ];
          for(const body of cases){
           const r=await fetch(base+'/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
           const result=await r.json();
           console.log('CASE',body.caseId,'STATUS',r.status,'META',JSON.stringify({model:result.model,advisory:result.advisory,critiqueLength:result.critique?.length,suggestionLength:result.suggested_reply?.length,caveatLength:result.caveat?.length,error:result.error,providerStatus:result.providerStatus}));
           if(!r.ok||!result.advisory||!result.critique||!result.suggested_reply||!result.caveat)throw Error('Live provider failed '+body.caseId);
           if(/guaranteed|100% secure|legally correct|send (?:us|me) your password/i.test(result.suggested_reply))throw Error('Unsupported assurance in '+body.caseId);
           if(body.kind==='legal'&&!/(specialist|qualified|legal review|patent counsel|professional review)/i.test(result.suggested_reply+' '+result.caveat))throw Error('Legal escalation missing');
          }
          console.log('ALL THREE ADDITIONAL LIVE CASES PASS');
          JS
