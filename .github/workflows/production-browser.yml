name: CASEWORK production browser acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'rules.mjs'
      - 'api/graphql.js'
      - 'ai-evaluation.mjs'
      - 'browser-smoke.mjs'
      - '.github/workflows/production-browser.yml'
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: BASE_URL=https://casework-investigation-desk-parthhhh.vercel.app node browser-smoke.mjs
